name: Collect Friday automation candidates

on:
  schedule:
    # 07:17 KST Friday. Leaves a 103-minute buffer before the 09:00 editor,
    # matching the Monday/Wednesday delay allowance.
    - cron: '17 22 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: friday-automation-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and rank automation candidates
        run: python3 -m blog_pipeline.collection.collect_automation --today

      - name: Verify automation collection
        run: python3 -m unittest tests.test_collect_automation tests.test_collect_news tests.test_news_pipeline

      - name: Commit Friday automation inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automation-inbox
          if git diff --cached --quiet; then
            echo "No automation inbox changes"
            exit 0
          fi
          git commit -m "chore: collect Friday automation candidates"
          git pull --rebase origin main
          git push origin HEAD:main
