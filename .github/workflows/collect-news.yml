name: Collect Monday Wednesday news candidates

on:
  schedule:
    # Monday/Wednesday 07:17 KST. Recent GitHub schedule delays reached about
    # 49 minutes, so this leaves a 103-minute buffer before the 09:00 editor.
    - cron: '17 22 * * 0,2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monday-wednesday-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync public Tistory post catalog
        run: python3 -m blog_pipeline.collection.sync_tistory_posts

      - name: Collect and rank news candidates
        run: python3 -m blog_pipeline.collection.collect_news --today

      - name: Verify collection pipeline
        run: python3 -m unittest tests.test_collect_news tests.test_news_pipeline tests.test_review_inbox tests.test_sync_tistory_posts

      - name: Commit today's inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/tistory_public_posts.json docs/inbox
          if git diff --cached --quiet; then
            echo "No inbox changes"
            exit 0
          fi
          git commit -m "chore: collect Monday Wednesday candidates"
          git pull --rebase origin main
          git push origin HEAD:main
