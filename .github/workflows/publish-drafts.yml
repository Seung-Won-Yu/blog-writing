name: Publish reviewed drafts

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/inbox/**'
      - 'docs/automation-inbox/**'
      - 'config/tistory_public_posts.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # CI only validates already-rendered WebP assets; production image generation
      # happens locally with a Korean font. Avoid a slow apt mirror dependency here.
      BLOG_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-images.txt

      - name: Verify test font
        run: test -r "$BLOG_FONT_PATH"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Verify optimized editorial images
        run: python3 -m blog_pipeline.publishing.optimize_images --check-all

      - name: Build committed draft previews
        run: |
          python3 -m blog_pipeline.publishing.build_copy_page
          python3 -m blog_pipeline.publishing.build_integration_page

      - name: Verify every future publish-ready draft
        run: python3 -m blog_pipeline.publishing.daily_guard --all-publish-ready

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the public handoff page
        id: public-verify
        continue-on-error: true
        run: |
          python3 -m blog_pipeline.publishing.pages_smoke \
            --url "${{ steps.deployment.outputs.page_url }}" \
            --expected-file docs/index.html \
            --cache-key "${{ github.sha }}"

      - name: Summarize public verification
        if: always()
        run: |
          echo "## GitHub Pages handoff" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment: ${{ steps.deployment.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- public verification: ${{ steps.public-verify.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.public-verify.outcome }}" != "success" ]]; then
            echo "- status: REMOTE_PUSHED_VERIFY_PENDING" >> "$GITHUB_STEP_SUMMARY"
          fi
