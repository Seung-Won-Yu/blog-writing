<!--
  Canonical custom HTML snippets for the Tistory skin.
  Keep article body markup out of skin.html. Tistory renders it through
  [##_article_rep_desc_##], and the generator owns only that fragment.
-->

<!-- Place near the top of <aside id="aside">, before category widgets. -->
<section class="dev-profile-card" aria-labelledby="dev-profile-title">
  <p class="dev-profile-card__eyebrow">이 블로그는</p>
  <h2 id="dev-profile-title">하루 한 시간 나를 Develop!</h2>
  <p>AI와 디지털 도구를 직접 활용하고, 막히는 문제를 쉽게 해결하는 블로그입니다.</p>
  <nav aria-label="블로그 바로가기">
    <a href="/notice">운영 안내</a>
    <a href="/category/%EC%8B%A4%EC%A0%84%20IT/%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8%C2%B7%ED%9A%8C%EA%B3%A0">프로젝트</a>
  </nav>
</section>

<!-- Use inside <s_tag> and <s_guest> so utility pages keep the same hierarchy. -->
<div class="post-header">
  <h1>페이지 제목</h1>
  <p class="page-description">페이지의 목적을 한 문장으로 안내합니다.</p>
</div>

<!-- Replace the stock Tistory footer credit block. -->
<p class="footer-brand">하루 한 시간 나를 Develop!</p>
<p class="meta">AI·디지털 도구 활용부터 문제 해결까지, 직접 확인하고 다시 꺼내 쓰는 기록.</p>
<p class="copyright">© 2026 쑥쑥자라나라.</p>

<!-- Keep as the last sidebar block, after recent/popular posts. -->
<section class="visitor-count" aria-labelledby="visitor-count-title">
  <h2 id="visitor-count-title">방문자</h2>
  <p class="visitor-count__total">
    <span>전체</span>
    <strong>[##_count_total_##]</strong>
  </p>
  <dl>
    <div><dt>오늘</dt><dd>[##_count_today_##]</dd></div>
    <div><dt>어제</dt><dd>[##_count_yesterday_##]</dd></div>
  </dl>
</section>
